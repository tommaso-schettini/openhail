name: Package checks

on:
  push:
  pull_request:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
        extras: [dev]
        include:
          - os: ubuntu-latest
            python: '3.13'
            extras: dev,ppo
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Create project environment
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$GITHUB_WORKSPACE/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          fi
      - name: Install dependencies and build wheel
        run: |
          python -m pip install build ".[${{ matrix.extras }}]"
          python -m build --wheel
      - name: Install built wheel
        shell: bash
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Test installed package
        run: python -m pytest -q --junitxml=tests/reports/junit.xml
      - name: Lint and formatting
        run: |
          python -m ruff check src scripts tests
          python -m ruff format --check src scripts tests
      - name: Check types with optional PPO dependencies
        if: matrix.extras == 'dev,ppo'
        run: python -m pyright
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.extras }}
          path: tests/reports/junit.xml
